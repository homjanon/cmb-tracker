name: 招招五维·五大行每日追踪

# 触发与门控（盘后 · 仅交易日 · 单次）
# =====================================================================
# 触发：唯一通道 = Cloudflare Worker `qdii-dispatch` 每日北京 16:30 调
#       workflow_dispatch（GitHub 侧无 schedule，禁止再加）。
#       Worker 只做「周一~周五」粗筛；**法定假期由本文件的 check 步骤用交易日历
#       (tool_trade_date_hist_sina) 精确排除**。
# 门控：check 步骤判定当日是否交易日 → 输出 trade=1/0；后续各步骤条件：
#         if: steps.check.outputs.trade == '1' || github.event.inputs.force == 'true'
#       ⚠️ 绝不可写成 `github.event_name == 'workflow_dispatch'`：单通道下该条件恒为真，
#          门控会被永久绕过（2026-10-03 事故，详见 README「踩坑记录」）。
# 手动：Actions 页面勾选 force=true → 忽略门控强制运行（补算 / 盘中快照）；
#       不勾（默认 false）→ 与自动调度同门控。
# =====================================================================
on:
  # 单通道：Cloudflare Worker qdii-dispatch 每天 16:30（北京时间）触发 workflow_dispatch
  workflow_dispatch:
    inputs:
      force:
        description: "强制运行：忽略『仅交易日』门控（仅供人工补算或盘中快照；自动调度不得传）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cmb-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 交易日判断：非交易日(节假日/周末) → skip
      # （手动触发时仍会继续，直接取当日或最近交易日数据）
      - name: 判断交易日
        id: check
        run: |
          python - <<'PY'
          import akshare as ak, datetime, os
          BJ = datetime.timezone(datetime.timedelta(hours=8))
          today = datetime.datetime.now(BJ).strftime("%Y-%m-%d")
          cal = ak.tool_trade_date_hist_sina()
          is_trade = today in {str(x)[:10] for x in cal["trade_date"].tolist()}
          if not is_trade:
              print(f"{today} 非交易日（节假日/周末），跳过当日计算（勾选 force 可强制运行）")
              open(os.environ["GITHUB_OUTPUT"], "a").write("trade=0\n")
              raise SystemExit(0)
          print(f"{today} 交易日，执行五维追踪")
          open(os.environ["GITHUB_OUTPUT"], "a").write("trade=1\n")
          PY

      - name: Run holdings drawdown (小散持仓回撤表)
        # 必须先于 run_daily 渲染：run_daily 读取 holdings_drawdown.json 注入网页，
        # 若渲染在前，新增标的/改成本要再触发一次才生效（顺序坑，2026-08-06 修复）
        if: steps.check.outputs.trade == '1' || github.event.inputs.force == 'true'
        env:
          TZ: Asia/Shanghai
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
        run: |
          python scripts/holdings_drawdown.py

      - name: Run daily tracker
        if: steps.check.outputs.trade == '1' || github.event.inputs.force == 'true'
        env:
          TZ: Asia/Shanghai
          BIYING_API_KEY: ${{ secrets.BIYING_API_KEY }}
        run: |
          cd scripts
          python run_daily.py

      - name: Commit & push results
        if: steps.check.outputs.trade == '1' || github.event.inputs.force == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json history.jsonl docs/ output/ data/holdings_drawdown_state.json data/holdings_drawdown.json data/holdings_preset.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: daily update (${{ github.run_id }})"
            git push
          fi